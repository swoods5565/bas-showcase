<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Meridian BAS</title>
<script>
  // GitHub Pages fallback: send unknown paths to the SPA (hash-based router)
  var base = location.pathname.split('/').slice(0, 2).join('/') + '/';
  if (location.hostname.endsWith('github.io') === false) base = '/';
  location.replace(base + '#/' );
</script></head><body></body></html>
